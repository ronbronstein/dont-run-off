name: validate

on:
  pull_request:
  push:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      # No local blocklist exists in CI, so this runs the structural and
      # generic-leak checks only. That is the point: the private blocklist
      # stays on the maintainer's machine.
      - run: node scripts/validate.mjs
