<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 440" role="img" aria-label="Don't Run Off, a harness for Claude Code. A clean paper map shows a straight route to the goal. The map lifts, and under it is the real territory: a river and a cliff that the map does not show. Question marks appear where the straight route meets them, and a true route draws around the cliff and over a small bridge to the goal.">
<!-- Source for assets/scene-hero-*.svg. Edit this file, then run: npm run art -->
<!-- The base attribute values draw the final frame (art rule 7); every animation runs on one 12 s clock. -->
<style>
text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
.halo { paint-order: stroke; stroke: #1e1c19; stroke-width: 5px; stroke-linejoin: round; }
.still { display: none; }
@media (prefers-reduced-motion: reduce) {
  .motion { display: none; }
  .still { display: inline; }
  * { animation: none !important; }
}
</style>
<defs>
  <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%"><feGaussianBlur stdDeviation="8"/></filter>
  <clipPath id="frame"><rect x="6" y="6" width="948" height="428" rx="14"/></clipPath>
  <g id="tuft" fill="none" stroke="#76845a" stroke-width="2" stroke-linecap="round">
    <path d="M0 0 l-5 -10 M0 0 l0 -13 M0 0 l5 -10 M-9 2 h18"/>
  </g>
  <!-- The map: a clean sheet with a neat grid, two tidy hills, and the straight route. -->
  <g id="sheet">
    <rect x="110" y="166" width="740" height="248" rx="6" fill="#34302a" stroke="#3a352d" stroke-width="2"/>
    <g stroke="#2a2722" stroke-width="1">
      <path d="M233 166 V414 M356 166 V414 M480 166 V414 M603 166 V414 M726 166 V414"/>
      <path d="M110 248 H850 M110 331 H850"/>
    </g>
    <g fill="none" stroke="#5a5144" stroke-width="1.5">
      <ellipse cx="300" cy="230" rx="60" ry="26"/>
      <ellipse cx="300" cy="230" rx="30" ry="12"/>
      <ellipse cx="640" cy="380" rx="70" ry="22"/>
    </g>
    <circle cx="150" cy="330" r="8" fill="#e8e0cc"/>
    <path d="M840 300 V252" stroke="#e8e0cc" stroke-width="3" stroke-linecap="round"/>
    <path d="M842 253 L872 264 L842 276 Z" fill="#e3896a"/>
    <text x="126" y="192" font-size="14" font-weight="600" fill="#e8e0cc" letter-spacing="1">THE MAP</text>
  </g>
  <g id="ask" font-size="22" font-weight="700" text-anchor="middle" fill="#1e1c19">
    <circle cx="545" cy="296" r="15" fill="#e3896a"/><text x="545" y="304">?</text>
    <circle cx="694" cy="286" r="15" fill="#e3896a"/><text x="694" y="294">?</text>
  </g>
  <g id="bridge" stroke="#e8e0cc" stroke-width="3" stroke-linecap="round">
    <path d="M474 386 H512 M474 398 H512"/>
  </g>
</defs>

<!-- Paper and title. Always still. -->
<rect x="6" y="6" width="948" height="428" rx="14" fill="#1e1c19" stroke="#3a352d" stroke-width="2"/>
<text x="480" y="96" font-size="70" font-weight="800" letter-spacing="-1.5" text-anchor="middle" fill="#e8e0cc">Don't Run Off</text>
<text x="480" y="134" font-size="15" font-weight="600" letter-spacing="3.5" text-anchor="middle" fill="#e3896a">A HARNESS FOR CLAUDE CODE</text>

<!-- The territory: what is really there. Always still. -->
<g clip-path="url(#frame)">
  <g stroke="#2a2722" stroke-width="1" opacity="0.6">
    <path d="M120 160 V434 M240 160 V434 M360 160 V434 M600 160 V434 M720 160 V434 M840 160 V434"/>
  </g>
  <g fill="none" stroke="#5a5144" stroke-width="1.5">
    <path d="M190 262 C 220 205 360 196 400 240 C 430 275 360 300 300 296 C 240 292 176 292 190 262 Z"/>
    <path d="M232 258 C 250 226 340 222 362 246 C 378 264 330 276 296 274 C 260 272 222 276 232 258 Z"/>
    <path d="M276 254 C 286 240 322 238 330 250 C 334 258 312 262 298 261 C 284 260 272 262 276 254 Z"/>
    <path d="M640 220 C 700 196 800 206 820 240 C 838 270 760 282 712 278 C 664 274 600 250 640 220 Z"/>
    <path d="M676 232 C 712 218 772 224 784 244 C 792 260 748 266 718 263 C 690 260 656 246 676 232 Z"/>
    <path d="M40 400 C 120 372 240 380 300 420"/>
    <path d="M760 434 C 790 400 880 392 940 410"/>
  </g>
  <path d="M560 160 C 520 220 600 270 525 326 C 470 364 500 400 486 440" fill="none" stroke="#4e7681" stroke-width="18" stroke-linecap="round"/>
  <path d="M556 196 c 6 4 12 4 18 0 M540 340 c 6 4 12 4 18 0" fill="none" stroke="#34302a" stroke-width="2" stroke-linecap="round" opacity="0.8"/>
  <g stroke="#e8e0cc" stroke-width="2.5" stroke-linecap="round" fill="none">
    <path d="M652 284 L700 298 L690 362"/>
    <path d="M664 288 l-6 10 M678 292 l-6 10 M692 296 l-6 10 M697 314 l-9 4 M695 330 l-9 4 M693 346 l-9 4"/>
  </g>
  <use href="#tuft" x="388" y="350"/>
  <use href="#tuft" x="410" y="362"/>
  <use href="#tuft" x="372" y="368"/>
  <circle cx="150" cy="330" r="8" fill="#e8e0cc"/>
  <circle cx="150" cy="330" r="15" fill="none" stroke="#e8e0cc" stroke-width="2"/>
  <text x="150" y="364" font-size="15" text-anchor="middle" fill="#e8e0cc" class="halo">you are here</text>
  <path d="M840 300 V252" stroke="#e8e0cc" stroke-width="3" stroke-linecap="round"/>
  <path d="M842 253 L872 264 L842 276 Z" fill="#e3896a"/>
  <text x="846" y="326" font-size="15" text-anchor="middle" fill="#e8e0cc" class="halo">goal</text>
  <text x="834" y="414" font-size="14" font-weight="600" letter-spacing="1" text-anchor="end" fill="#e8e0cc" class="halo">THE TERRITORY</text>
</g>

<g class="motion">
  <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.03;0.96;1" dur="12s" repeatCount="indefinite"/>

  <!-- The map lies on the land, then lifts and fades. -->
  <g opacity="0">
    <animate attributeName="opacity" values="0;0;0.12;0.12" keyTimes="0;0.22;0.34;1" dur="12s" repeatCount="indefinite"/>
    <rect x="118" y="176" width="740" height="248" rx="6" fill="#e8e0cc" filter="url(#shadow)" transform="translate(-18 -22) rotate(-2 480 290)">
      <animateTransform attributeName="transform" type="translate" values="0 0;0 0;-18 -22;-18 -22" keyTimes="0;0.22;0.34;1" dur="12s" repeatCount="indefinite"/>
      <animateTransform attributeName="transform" type="rotate" values="0 480 290;0 480 290;-2 480 290;-2 480 290" keyTimes="0;0.22;0.34;1" dur="12s" repeatCount="indefinite" additive="sum"/>
    </rect>
  </g>
  <g opacity="0.2" transform="translate(-18 -22) rotate(-2 480 290)">
    <animate attributeName="opacity" values="1;1;0.2;0.2" keyTimes="0;0.22;0.34;1" dur="12s" repeatCount="indefinite"/>
    <animateTransform attributeName="transform" type="translate" values="0 0;0 0;-18 -22;-18 -22" keyTimes="0;0.22;0.34;1" dur="12s" repeatCount="indefinite"/>
    <animateTransform attributeName="transform" type="rotate" values="0 480 290;0 480 290;-2 480 290;-2 480 290" keyTimes="0;0.22;0.34;1" dur="12s" repeatCount="indefinite" additive="sum"/>
    <use href="#sheet"/>
    <path pathLength="1" d="M158 329 L834 301" fill="none" stroke="#e3896a" stroke-width="4" stroke-linecap="round" stroke-dasharray="1 1" stroke-dashoffset="0">
      <animate attributeName="stroke-dashoffset" values="1;1;0;0" keyTimes="0;0.04;0.16;1" dur="12s" repeatCount="indefinite"/>
    </path>
  </g>

  <!-- Where the straight route meets the territory, a question. -->
  <g opacity="1">
    <animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.38;0.42;1" dur="12s" repeatCount="indefinite"/>
    <circle cx="545" cy="296" r="15" fill="#e3896a"/>
    <text x="545" y="304" font-size="22" font-weight="700" text-anchor="middle" fill="#1e1c19">?</text>
  </g>
  <g opacity="1">
    <animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.44;0.48;1" dur="12s" repeatCount="indefinite"/>
    <circle cx="694" cy="286" r="15" fill="#e3896a"/>
    <text x="694" y="294" font-size="22" font-weight="700" text-anchor="middle" fill="#1e1c19">?</text>
  </g>

  <!-- The true route: over a small bridge, around the cliff, to the goal. -->
  <g opacity="1">
    <animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.52;0.56;1" dur="12s" repeatCount="indefinite"/>
    <use href="#bridge"/>
  </g>
  <path pathLength="1" d="M158 334 C 260 384 400 394 470 392 C 560 390 640 404 716 380 C 780 362 820 336 838 306" fill="none" stroke="#e3896a" stroke-width="5" stroke-linecap="round" stroke-dasharray="1 1" stroke-dashoffset="0">
    <animate attributeName="stroke-dashoffset" values="1;1;0;0" keyTimes="0;0.56;0.8;1" dur="12s" repeatCount="indefinite" calcMode="spline" keySplines="0 0 1 1;0.4 0 0.2 1;0 0 1 1"/>
  </path>
</g>

<!-- The still frame for reduced motion: the map lifted, the questions, the true route. -->
<g class="still">
  <rect x="118" y="176" width="740" height="248" rx="6" fill="#e8e0cc" filter="url(#shadow)" opacity="0.12" transform="translate(-18 -22) rotate(-2 480 290)"/>
  <g opacity="0.2" transform="translate(-18 -22) rotate(-2 480 290)">
    <use href="#sheet"/>
    <path d="M158 329 L834 301" fill="none" stroke="#e3896a" stroke-width="4" stroke-linecap="round"/>
  </g>
  <use href="#ask"/>
  <use href="#bridge"/>
  <path d="M158 334 C 260 384 400 394 470 392 C 560 390 640 404 716 380 C 780 362 820 336 838 306" fill="none" stroke="#e3896a" stroke-width="5" stroke-linecap="round"/>
</g>
</svg>
