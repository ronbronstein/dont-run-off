<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 380" role="img" aria-label="A route shoots from you are here off the map and into fog, far from the goal. It rewinds. A pin stops it at the start, a short plan appears, a check mark gives the nod, and the route follows the plan to the goal.">
<!-- Source for assets/scene-runs-off-*.svg. Edit this file, then run: npm run art -->
<!-- The base attribute values draw the final frame (art rule 7); every animation runs on one 10 s clock. -->
<style>
text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
.still { display: none; }
@media (prefers-reduced-motion: reduce) {
  .motion { display: none; }
  .still { display: inline; }
  * { animation: none !important; }
}
</style>
<defs>
  <clipPath id="map"><rect x="6" y="6" width="948" height="368" rx="14"/></clipPath>
  <filter id="soft" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="16"/></filter>
</defs>

<!-- The map: paper, grid, terrain. Always still. -->
<rect x="6" y="6" width="948" height="368" rx="14" fill="#f4ecd8" stroke="#d9c9a6" stroke-width="2"/>
<g stroke="#e6d9bb" stroke-width="1">
  <path d="M120 6 V374 M240 6 V374 M360 6 V374 M480 6 V374 M600 6 V374 M720 6 V374 M840 6 V374"/>
  <path d="M6 95 H954 M6 190 H954 M6 285 H954"/>
</g>
<g fill="none" stroke="#c4b08a" stroke-width="1.5">
  <path d="M300 370 C 340 320 470 315 520 370"/>
  <path d="M340 374 C 370 345 450 342 480 374"/>
  <path d="M600 330 C 640 300 720 300 760 335 C 780 352 700 362 650 356 C 615 352 590 345 600 330 Z"/>
</g>

<!-- Start and goal. -->
<g fill="#3b3a36">
  <circle cx="104" cy="250" r="7"/>
  <circle cx="104" cy="250" r="14" fill="none" stroke="#3b3a36" stroke-width="2"/>
  <text x="104" y="286" font-size="15" text-anchor="middle">you are here</text>
</g>
<g>
  <path d="M856 232 V176" stroke="#3b3a36" stroke-width="3" stroke-linecap="round"/>
  <path d="M858 177 L894 189 L858 202 Z" fill="#c86a4a"/>
</g>

<!-- Animated layer. -->
<g class="motion">
  <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.03;0.96;1" dur="10s" repeatCount="indefinite"/>

  <!-- The run-off: fast and sure, the wrong way, into the fog. It rewinds, then stays as a faint ghost. -->
  <path clip-path="url(#map)" pathLength="1" d="M110 248 C 250 236 360 130 500 90 C 640 50 800 30 1000 20" fill="none" stroke="#c86a4a" stroke-width="5" stroke-linecap="round" stroke-dasharray="1 1" stroke-dashoffset="0" opacity="0.25">
    <animate attributeName="stroke-dashoffset" values="1;0;0;1;1;0;0" keyTimes="0;0.16;0.26;0.36;0.84;0.9;1" dur="10s" repeatCount="indefinite"/>
    <animate attributeName="stroke-width" values="5;5;3;3" keyTimes="0;0.84;0.85;1" dur="10s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="1;1;0.25;0.25" keyTimes="0;0.84;0.85;1" dur="10s" repeatCount="indefinite"/>
  </path>

  <!-- The pin: it stops at the start. -->
  <g>
    <animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.38;0.42;1" dur="10s" repeatCount="indefinite"/>
    <animateTransform attributeName="transform" type="translate" values="0 -40;0 -40;0 0;0 0" keyTimes="0;0.38;0.44;1" dur="10s" repeatCount="indefinite" calcMode="spline" keySplines="0 0 1 1;0.3 0 0.2 1.3;0 0 1 1"/>
    <path d="M104 234 C 93 220 88 211 88 204 A16 16 0 1 1 120 204 C 120 211 115 220 104 234 Z" fill="#c86a4a" stroke="#3b3a36" stroke-width="2"/>
    <circle cx="104" cy="204" r="5.5" fill="#f4ecd8"/>
  </g>

  <!-- The plan: a short, dotted route in slices. -->
  <g fill="none" stroke="#3b3a36" stroke-linecap="round">
    <animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.46;0.54;1" dur="10s" repeatCount="indefinite"/>
    <path d="M110 250 C 300 258 420 212 560 216 C 680 220 760 236 850 232" stroke-width="2.5" stroke-dasharray="2 9"/>
    <path d="M326 236 l4 18 M560 206 v20 M712 216 l-2 20" stroke-width="3"/>
  </g>

  <!-- The nod. -->
  <path pathLength="1" d="M134 206 l9 9 l17 -20" fill="none" stroke="#c86a4a" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="1 1" stroke-dashoffset="0">
    <animate attributeName="stroke-dashoffset" values="1;1;0;0" keyTimes="0;0.58;0.63;1" dur="10s" repeatCount="indefinite"/>
  </path>

  <!-- The route that was agreed: it follows the plan to the goal. -->
  <path pathLength="1" d="M110 250 C 300 258 420 212 560 216 C 680 220 760 236 850 232" fill="none" stroke="#c86a4a" stroke-width="5" stroke-linecap="round" stroke-dasharray="1 1" stroke-dashoffset="0">
    <animate attributeName="stroke-dashoffset" values="1;1;0;0" keyTimes="0;0.66;0.84;1" dur="10s" repeatCount="indefinite" calcMode="spline" keySplines="0 0 1 1;0.4 0 0.2 1;0 0 1 1"/>
  </path>
</g>

<!-- The still frame for reduced motion: the same as the last frame above. -->
<g class="still">
  <path clip-path="url(#map)" d="M110 248 C 250 236 360 130 500 90 C 640 50 800 30 1000 20" fill="none" stroke="#c86a4a" stroke-width="3" stroke-linecap="round" opacity="0.25"/>
  <path d="M104 234 C 93 220 88 211 88 204 A16 16 0 1 1 120 204 C 120 211 115 220 104 234 Z" fill="#c86a4a" stroke="#3b3a36" stroke-width="2"/>
  <circle cx="104" cy="204" r="5.5" fill="#f4ecd8"/>
  <g fill="none" stroke="#3b3a36" stroke-linecap="round">
    <path d="M110 250 C 300 258 420 212 560 216 C 680 220 760 236 850 232" stroke-width="2.5" stroke-dasharray="2 9"/>
    <path d="M326 236 l4 18 M560 206 v20 M712 216 l-2 20" stroke-width="3"/>
  </g>
  <path d="M134 206 l9 9 l17 -20" fill="none" stroke="#c86a4a" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M110 250 C 300 258 420 212 560 216 C 680 220 760 236 850 232" fill="none" stroke="#c86a4a" stroke-width="5" stroke-linecap="round"/>
</g>
<!-- Fog past the known part of the map, above the routes so the run-off goes into it. -->
<g clip-path="url(#map)" filter="url(#soft)" fill="#fbf8f0">
  <ellipse cx="760" cy="40" rx="190" ry="70"/>
  <ellipse cx="910" cy="30" rx="110" ry="60"/>
  <ellipse cx="900" cy="70" rx="120" ry="90"/>
</g>
</svg>
